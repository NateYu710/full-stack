<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function TodoList() {
        // TODO 1. 상태 3개 만들기
        const [todo, setToDo] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        useEffect(() => {
          async function getTodos() {
            // TODO 2. try / catch / finally 작성

            // TODO 3. fetch

            // TODO 4. response.ok 검사

            // TODO 5. json 변환

            // TODO 6.
            // completed가 true이고
            // id가 10 이하인 데이터만 filter

            // TODO 7. 상태에 저장
            try {
              const response = await fetch(
                'https://jsonplaceholder.typicode.com/todos',
              );

              if (!response.ok) {
                throw new Error('응답이 없습니다');
              }
              const data = await response.json();

              const newData = data.filter(
                (user) => user.completed === true && user.id <= 10,
              );

              setToDo(newData);
            } catch (error) {
              setError(error);
            } finally {
              setLoading(false);
            }
          }

          // TODO 8. getTodos 실행
          getTodos();
        }, []);

        // TODO 9. loading 처리
        if (loading) {
          return <p>유저들을 불러모으는중....</p>;
        }

        // TODO 10. error 처리
        if (error) {
          return <p>오류가 발생했습니다: {error.message}</p>;
        }

        return (
          <div>
            <h1>완료된 할 일</h1>

            {/* TODO 11. map으로 id와 title 출력 */}
            {todo.map((user) => (
              <p key={user.id}>
                id: {user.id}
                <br />
                title: {user.title}
              </p>
            ))}
          </div>
        );
      }

      function App() {
        return (
          <>
            <TodoList />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
