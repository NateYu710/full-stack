<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">

        const {useState} = React;
        

        function SignupFormBasic() {

            const [username, setUsername] = useState('');
            const [email, setEmail] = useState('');
            // 초깃값은 빈값으로 둠 

            const handleSignup = () => {
                alert(`아이디: ${username}\n이메일: ${email}\n 회원가입 완료!`);
                setUsername(''); // 빈 문자열로 초기화 목적
                setEmail(''); // 빈 문자열로 초기화 목적
            }
            return (
                <>
                    <h2> 기본적인 이벤트 처리</h2>
                    <input 
                    type="text"
                    placeholder="아이디"
                    value={username}
                    // value 와 onChange를 함께 연결하면 input 값이 React state에 의해 관리된다.
                    // onChange: 'input의 내용물에 변화가 생길 때마다'
                    // e.target.value: 이벤트를 일으킨 장본인(e.target)이 가지고 있는 최신 값(value)
                    onChange={e => setUsername(e.target.value)} // 입력값이 바뀔 때 실행되는 이벤트
                    />
                    <br/>
                    <input type="email"
                    placeholder="이메일"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    />
                    <button onClick={handleSignup}>가입하기</button>
                </>
            )
        }

        // 하나의 객체 state로 여러 input을 관리하는 방식
        function SignupFormAdvanced() {
            const [form, setForm] = useState({
                username: '',
                email: ''
            });
            // 구조분해할당
            const {username, email} = form;

            const handleChange = (e) => {
               // console.log(e.target);

               //name은 어떤 input에서 이벤트가 발생했는지 구분하는 이름
               // value는 사용자가 입력한 최신 값
               const {name, value} = e.target;
               console.log(name, value);
            
                setForm({
                    ...form, //기존 form 객체 복사
                    [name]: value //변경이 일어난 input의 name을 key로 삼아, 새로운 value로 덮어쓴다.
                })
            }

            const handleSignup = () =>  {
                alert(`아이디: ${username}, 이메일: ${email}`);
                setForm({ username: '', email: ''});
            }
            
            
            return (
                <>
                    <h2> 효율적인 이벤트 처리</h2>
                    <input 
                    type="text"
                    name="username" // state 객체의 key와 동일한 이름!
                    placeholder="아이디"
                    value={username}
                    onChange={handleChange} 
                    />
                    <br/>
                    <input 
                    type="email"
                    name="email"
                    placeholder="이메일"
                    value={email}
                    onChange={handleChange}
                    />
                    <button onClick={handleSignup}>가입하기</button>
                </>
            )
        }

        function CustomButton({onClick, children}){ // 재사용할 컴포넌트
            // 컴포넌트는 항상 대문자
            
        // console.log(props);
            
            return(
                <>
                    <button style={{backgroundColor: 'black', 
                    color: 'white', border: 'none'}} onClick={onClick}>{children}</button>
                    {/*첫번째 온클릭은 이벤트 온클릭 두번째 온클릭은 부모로 부터 받은 함수*/}
                </>
            )
        }

        function App() {
            const showWelcomeMessage = () => {
                alert('우리 사이트에 오신 것을 환영합니다.');
            }
            
            
            return (
                <>
                    <SignupFormBasic/>
                    <hr/>
                    <SignupFormAdvanced/>
                    <hr/>
                    <CustomButton onClick={showWelcomeMessage}><strong>환영메시지</strong></CustomButton>
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>

</body>
</html>
