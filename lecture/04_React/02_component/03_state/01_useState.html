<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">

        /**
         * 
         * useState Hook
         * - Hook : 함수형 컴포넌트가 React의 기능을 사용할 수 있게 연결해주는 함수
         * - 함수형 컴포넌트에서 State를 사용할 수 있게 해주는 함수이다
         * - 컴포넌트: HTML 화면 일부를 만들어주는 재사용 가능한 함수(즉 함수이름)
         * - state: 컴포넌트 내부에서 관리, setter로 변경
         * - const [state값, setter함수] = useState(초기값);
         * - setter(새로운값);

예:
         */
        // console.log(React);
        // React.useState();
         const {useState} = React; // react에서 useState함수를 가져온다(객체 구조분해 할당)

         function MessageManager() {
            // useState 호출: [상태 값, 상태 변경 함수] = useState(초기값);
            const [message, setMessage] = useState('초기 상태 메세지입니다.');
            // message, setMessage를 여기서 state라고 한다
            const [textColor, setTextColor] = useState('black');

            // 상태 변경함수(Setter)를 호출하면 -> 컴포넌트가 '리렌더링' 된다.(새로고침X)
            // 컴포넌트 함수가 다시 실행되면서 변경된 state 값으로 JSX가 다시 만들어진다
            console.log("messageManager 컴포넌트가 렌더링 되었습니다.");

            const handleEnter = () => {
                setMessage('안녕하세요! 환영합니다.');
                setTextColor('blue');
            };

            const handleLeave = () => {
                setMessage('안녕히 가세요! 다음에 또 만나요~');
                setTextColor('red')
            }

            return (
                <>
                    <h1>함수형 컴포넌트 (useState)</h1>
                    <h2 style={{color: textColor}}>{message}</h2>
                    {/*초기 상태 메세지입니다, black => */}
                    <button onClick={handleEnter}>입장</button>
                    {/*입장 버튼을 누르면 handleEnter 실행*/}
                    <button onClick={handleLeave}>퇴장</button>
                    {/*퇴장 버튼을 누르면 handleLeave 실행*/}
                </>
            )
         }

        function Counter() {
            const [number, setNumber] = useState(0);
            //함수형 업데이트: 이전 상태 값을 안전하게 사용하기
            // setter 함수의 첫번째 매개변수 prev 에는 React가 관리하는 최신 이전 상태값이 들어간다
            // 같은 이벤트 안에서 이전 state를 기준으로 연속 계산해야 한다면 이방식의 함수형 업데이트를 한다
            
            
            // setter에 함수가 들어오면 그 함수의 첫 번째 인수로 해당 state의 최신 이전 값을 넣어주도록 
            // useState가 원래 그렇게 설계되어 있다

            const increaseByTwo = () => {
                setNumber((prev) => prev + 1);
                setNumber((prev) => prev + 1);
            }
            // 변수에 2가 저장
            return (
                <>
                    <h1>함수형 컴포넌트 카운터</h1>
                    <h2>현재 숫자: {number}</h2>
                    <button onClick={() => setNumber(number+1)}>+1</button>
                    <button onClick={() => setNumber(number-1)}>-1</button>
                    <button onClick={() => {
                        /**
                         * setNumber를 연속으로 호출해도 number 값이 바로 바뀌는 것이 아니라,
                            // 현재 렌더링에서 사용 중인 같은 number 값을 기준으로 두 번 계산한다.
                            // 예를 들어 number가 0이면 두 줄 모두 0 + 1을 계산해서 1을 요청하므로,
                            // 최종 결과는 2가 아니라 1이 된다.
                        */    
                        setNumber(number+1);
                        setNumber(number+1);
                    }}>+2 (의도대로 안됨)</button>
                    <button onClick={increaseByTwo}>+2 (함수형 업데이트)</button>
                </>
            )
        }

         function App() {
            return (
                <>
                    <MessageManager/>
                    <hr/>
                    <Counter/>
                </>
            )
         }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
