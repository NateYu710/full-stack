<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">

        const {useState, useEffect, useCallback} = React;

        function App() {
            // 컴포넌트 함수가 재실행되면 내부의 함수 선언 코드도 다시 실행되기 때문에 새로운 함수 객체가 만들어진다
            const [number, setNumber] = useState(0);
            const [toggle, setToggle] = useState(false);

            const printNumber = useCallback( ()=> {
                console.log('current number' , number);
            }, [number]);

            /**
             * [] → 처음 한 번 만든 함수를 계속 재사용(0값을 넣으면 숫자를 바꿔줘도 0으로 기억)
                number] → number가 바뀔 때마다 함수를 새로 만든다
             */

            // const printNumber = () => {
            //     console.log('current number', number);
            // }

            useEffect(() => {
                console.log('printNumber 함수가 변경되었습니다');
            }, [printNumber]);

            return (
                <>
                    <input type="number"
                           value={number}
                           onChange={e => setNumber(Number(e.target.value))}/>
                    <button onClick ={printNumber}>숫자 출력</button>
                    <hr/>
                    <button onClick={() => setToggle(!toggle)}>토글 버튼</button>
                    <p>토글 상태 : {String(toggle)}</p>
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>

</body>
</html>
