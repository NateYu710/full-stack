<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">

        const {useState, useEffect, useCallback} = React;

        function App() {
            
            const [size, setSize] = useState(200);
            const [isDark, setIsDark] = useState(false);
            
            // 스타일 객체를 만드는 함수
            // const genSqareStyle = () => {
            //     return {
            //         backgroundColor: 'orange',
            //         width: `${size}px`,
            //         height: `${size}px`
            //     }
            // }

            const genSqareStyle = useCallback( () => {
              return {
                    backgroundColor: 'orange',
                    width: `${size}px`,
                    height: `${size}px`  
            }}, [size])
            
            
            return (
                <div style ={{ backgroundColor: isDark ? 'black' : 'white'}}>
                    <input type="range" // 슬라이더로 숫자 값을 선택할 때 사용하는 input
                           min ="100"
                           max="300"
                           value={size}
                           onChange={(e) => setSize(Number(e.target.value))}/>
                    <button onClick={() => setIsDark(!isDark)}>테마 변경</button>
                    <Square genSquareStyle={genSqareStyle}/>
                    {/*부모의 genSqareStyle 함수를 genSquareStyle이라는 props 이름으로 자식 Square에 전달하는 코드*/}
                    {/*자식 컴포넌트 렌더링해줘라는 뜻(Square/)*/}
                </div>
            )
        }

        function Square({genSquareStyle}) {
            // prop.genSquareStyle을 객체 구조분해
            console.log('자식 컴포넌트(square) 렌더링');

            const [style, setStyle] = useState({});

            useEffect(() => {
                console.log('자식의 useEffect 실행(스카일 변경됨)');
                setStyle(genSquareStyle());
            }, [genSquareStyle]);

            return <div style={style}></div>
            // 화면에 렌더링할 JSX를 반환하는 역할
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>

</body>
</html>
