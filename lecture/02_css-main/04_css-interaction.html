<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙션</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: aqua;
            margin: 20px;
            color: black;
            text-decoration: none;
            /* 링크는 밑줄이 생기는데 이렇게 하면 밑줄이 사라짐 */
            border-radius: 10px;
            transition: all 0.5s ease;
        }
        .button:hover {
            background-color: rgb(1, 180, 180);
            color: white;
            transform: translateY(-5px);
            /* 요소의 모양 변형 */
            box-shadow: 0 5px 10px rgba(0, 94, 94, 0.589);
            opacity: 0.9;
        }
         /* hover: 마우스 커서를 올렸을 때의 상태를 선택  */
         /* Active: 요소를 클릭하고 있는 동안의 상태 선택 */
         .button:active {
            transform: translateY(-2px)
         }
    </style>
</head>
<body>
    <h1>마우스 반응과 부드러운 효과</h1>
    <p>가상 클래스 선택자(:hover)와 트랜지션(transition)을 이용해 인터랙션 할 수 있다.</p>

    <a href="#" class="button">마우스를 올려보세요!</a>
    <!-- #은 임시링크 -->
</body>
</html>
